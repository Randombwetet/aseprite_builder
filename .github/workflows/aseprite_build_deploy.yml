name: Build and deploy Aseprite

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  ASEPRITE_VERSION: v1.3.11
  
jobs:
  build-aseprite:
    name: Build Aseprite (Windows)
    runs-on: windows-latest
    steps:
      - name: Get Skia from cache
        id: skia-cache
        uses: actions/cache@v4
        with:
          path: skia
          key: skia-windows-cache
          
      - name: Download Skia if not in cache
        if: steps.skia-cache.outputs.cache-hit != 'true'
        run: |
          curl -o Skia-Windows-Release-X64.zip -L https://github.com
          unzip Skia-Windows-Release-X64.zip -d skia
          
      - name: Download Aseprite source code
        run: |
          curl -o Aseprite-source.zip -L https://github.com{{ env.ASEPRITE_VERSION }}/Aseprite-${{ env.ASEPRITE_VERSION }}-Source.zip
          unzip Aseprite-source.zip -d aseprite
          mkdir -p aseprite/build
          
      - name: Set architecture for the produced binary
        shell: cmd
        run: call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        
      - name: Run CMake
        working-directory: aseprite/build
        shell: cmd
        run: cmake -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DLAF_BACKEND=skia -DSKIA_DIR=../../skia -DSKIA_LIBRARY_DIR=../../skia/out/Release-x64 -G Ninja ..
        
      - name: Run Ninja
        working-directory: aseprite/build
        run: ninja aseprite
        
      - name: Clean up build binaries
        working-directory: aseprite/build/bin
        shell: bash
        run: rm -f gen modp_b64_gen gen.exe gen.exe.manifest modp_b64_gen.exe modp_b64_gen.exe.manifest
        
      - name: Make portable configuration
        working-directory: aseprite/build/bin
        run: echo '# This file is here so Aseprite behaves as a portable program' > aseprite.ini
        
      - name: Upload Compiled App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-${{ env.ASEPRITE_VERSION }}-Windows
          path: aseprite/build/bin/
