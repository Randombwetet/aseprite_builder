name: Build and deploy Aseprite

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  ASEPRITE_VERSION: v1.3.11
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  
jobs:
  build-aseprite:
    name: Build Aseprite (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout Aseprite Stable Source
        uses: actions/checkout@v4
        with:
          repository: aseprite/aseprite
          ref: refs/tags/v1.3.11
          submodules: recursive
          path: aseprite

      - name: Get Skia from cache
        id: skia-cache
        uses: actions/cache@v4
        with:
          path: skia
          key: skia-windows-cache
          
      - name: Download Skia if not in cache
        if: steps.skia-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          curl.exe -o Skia-Windows-Release-X64.zip -L https://github.com
          Expand-Archive -Path Skia-Windows-Release-X64.zip -DestinationPath skia
          
      - name: Setup Build Directory
        run: mkdir aseprite/build
          
      - name: Configure CMake and Run Ninja Build
        working-directory: aseprite/build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DLAF_BACKEND=skia -DSKIA_DIR=../../skia -DSKIA_LIBRARY_DIR=../../skia/out/Release-x64 -G Ninja ..
          ninja aseprite
          
      - name: Clean up build binaries
        working-directory: aseprite/build/bin
        shell: bash
        run: rm -f gen modp_b64_gen gen.exe gen.exe.manifest modp_b64_gen.exe modp_b64_gen.exe.manifest
        
      - name: Make portable configuration
        working-directory: aseprite/build/bin
        shell: cmd
        run: echo # This file is here so Aseprite behaves as a portable program > aseprite.ini
        
      - name: Upload Compiled App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-v1.3.11-Windows
          path: aseprite/build/bin/
